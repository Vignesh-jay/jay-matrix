name: JAY Matrix Monitor

on:

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:

  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Monitor
        run: |
          python scripts/monitor.py

      - name: Commit Changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/status.json

          git diff --cached --quiet || git commit -m "Auto update status"

          git push